# /etc/nginx/sites-available/lesen.svetho.net
#
# Erst nur für HTTP angelegt. Danach ergänzt
#   sudo certbot --nginx -d lesen.svetho.net
# automatisch HTTPS, das Zertifikat und die Weiterleitung von HTTP auf HTTPS.
#
# Passwortdatei: sudo htpasswd -c /etc/nginx/.htpasswd-lesen DEINNAME

server {
    listen 80;
    listen [::]:80;
    server_name lesen.svetho.net;

    auth_basic           "Lesen";
    auth_basic_user_file /etc/nginx/.htpasswd-lesen;

    client_max_body_size 2m;

    # Let's Encrypt muss ohne Passwort durchkommen
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Schriften dürfen lange im Browser liegen bleiben
    location /static/fonts/ {
        proxy_pass http://127.0.0.1:8077;
        expires 1y;
    }
}
