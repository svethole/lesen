# /etc/nginx/sites-available/lesen.svetho.net
# Zertifikat vorher holen: sudo certbot --nginx -d lesen.svetho.net
# Passwortdatei:          sudo htpasswd -c /etc/nginx/.htpasswd-lesen DEINNAME

server {
    listen 80;
    listen [::]:80;
    server_name lesen.svetho.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lesen.svetho.net;

    ssl_certificate     /etc/letsencrypt/live/lesen.svetho.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lesen.svetho.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    auth_basic           "Lesen";
    auth_basic_user_file /etc/nginx/.htpasswd-lesen;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Schriften und Programmdateien dürfen lange im Browser liegen bleiben
    location /static/fonts/ {
        proxy_pass http://127.0.0.1:8077;
        expires 1y;
    }
}
